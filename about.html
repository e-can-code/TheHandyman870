<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operations | The Handyman 870</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #4a86e8;
            --sub-text: #8ab4f8;
            --btn-border: #4a86e8;
            --placeholder-bg: #f2f2f2;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #d3d3d3;
            --sub-text: #a9a9a9;
            --btn-border: #808080;
            --placeholder-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 80px 20px;
        }

        h1 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 60px;
            font-weight: bold;
            opacity: 0.9;
        }

        .team-stack {
            width: 100%;
            margin-bottom: 80px;
        }

        .member-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            border-bottom: 1px solid var(--btn-border);
        }

        .member-row:first-child {
            border-top: 1px solid var(--btn-border);
        }

        .member-meta {
            flex: 1;
        }

        .name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .role {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--sub-text);
        }

        /* Structured Photo Placeholder */
        .photo-box {
            width: 120px;
            height: 120px;
            background-color: var(--placeholder-bg);
            border: 1px solid var(--btn-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--sub-text);
            margin-left: 20px;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* This will make your future photos look great automatically */
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-color);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--btn-border);
            padding: 14px 28px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        @media (max-width: 480px) {
            .photo-box { width: 80px; height: 80px; }
            .name { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Operations</h1>

        <div class="team-stack">
            <div class="member-row">
                <div class="member-meta">
                    <span class="name">Name</span>
                    <span class="role">Lead Handyman</span>
                </div>
                <div class="photo-box">
                    <span>[PHOTO]</span>
                    </div>
            </div>

            <div class="member-row">
                <div class="member-meta">
                    <span class="name">Name</span>
                    <span class="role">Junior Handyman</span>
                </div>
                <div class="photo-box">
                    <span>[PHOTO]</span>
                </div>
            </div>

            <div class="member-row">
                <div class="member-meta">
                    <span class="name">Name</span>
                    <span class="role">Office Operations</span>
                </div>
                <div class="photo-box">
                    <span>[PHOTO]</span>
                </div>
            </div>
        </div>

        <a href="index.html" class="nav-link">Return</a>
    </div>

</body>
</html>
