<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team | The Handyman 870</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #4a86e8;
            --sub-text: #8ab4f8;
            --btn-border: #4a86e8;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #d3d3d3;
            --sub-text: #a9a9a9;
            --btn-border: #808080;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px; /* Narrower for a more focused, minimalist feel */
            width: 100%;
            padding: 80px 20px;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 50px;
            font-weight: bold;
        }

        .team-list {
            width: 100%;
            margin-bottom: 60px;
        }

        .member {
            padding: 20px 0;
            border-bottom: 1px solid var(--btn-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        .role {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sub-text);
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--btn-border);
            padding: 12px 24px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Team</h1>

        <div class="team-list">
            <div class="member">
                <span class="name">Name</span>
                <span class="role">Lead Handyman</span>
            </div>

            <div class="member">
                <span class="name">Name</span>
                <span class="role">Junior Handyman</span>
            </div>

            <div class="member">
                <span class="name">Name</span>
                <span class="role">Office Operations</span>
            </div>
        </div>

        <a href="index.html" class="nav-link">Return</a>
    </div>

</body>
</html>
