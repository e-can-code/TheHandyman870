<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Team | the handyman 870.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0ede4;      
            --text-color: #1a1c1e;    
            --sub-text: #6a727c;
            --btn-bg: #2b59c3;        
            --btn-text: #ffffff;      
            --btn-border: #1a1c1e;    
            --content-bg: #e6e2d6;    
            --accent-glow: #2b59c3;
            --shadow: 6px 6px 0px var(--btn-border);
        }

        [data-theme="dark"] {
            --bg-color: #121416;      
            --text-color: #e3e6e9;
            --sub-text: #9ba3af;
            --btn-bg: #3d71e9;        
            --btn-text: #ffffff;
            --btn-border: #000000;
            --content-bg: #1c1f23;
            --accent-glow: #3d71e9;
            --shadow: 6px 6px 0px #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 24px;
            box-sizing: border-box;
        }

        .nav-item {
            background: transparent;
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 18px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s;
        }

        .nav-item:hover {
            background: var(--btn-border);
            color: var(--bg-color);
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
            margin-top: 40px;
            margin-bottom: 80px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 40px;
        }

        .team-card {
            background-color: var(--content-bg);
            border: 2.5px solid var(--btn-border);
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 25px;
            align-items: flex-start;
            position: relative;
        }

        .team-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--accent-glow);
        }

        .member-photo {
            width: 120px;
            height: 120px;
            background: var(--bg-color);
            border: 2px solid var(--btn-border);
            flex-shrink: 0;
            object-fit: cover;
        }

        .member-info {
            display: flex;
            flex-direction: column;
        }

        .member-name {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .member-role {
            font-weight: 700;
            color: var(--accent-glow);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .member-bio {
            line-height: 1.5;
            color: var(--text-color);
            font-size: 15px;
            margin-top: 5px;
        }

        @media (max-width: 500px) {
            .team-card { flex-direction: column; align-items: center; text-align: center; }
            .team-card::before { width: 100%; height: 4px; top: 0; left: 0; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="nav-item">← Return</a>
    </div>

    <div class="container">
        <h1>The Team</h1>

        <div class="team-card">
            <img src="lead.jpg" alt="Stacey" class="member-photo">
            <div class="member-info">
                <span class="member-name">Stacey</span>
                <span class="member-role">Lead Handyman</span>
                <p class="member-bio">
                    Bringing 25 years of experience in construction and repair to every job site.
                </p>
            </div>
        </div>

        <div class="team-card">
            <img src="junior.jpg" alt="Ka'eo" class="member-photo">
            <div class="member-info">
                <span class="member-name">Kala'e</span>
                <span class="member-role">Junior Handyman</span>
            </div>
        </div>

        <div class="team-card">
            <img src="office.jpg" alt="India" class="member-photo">
            <div class="member-info">
                <span class="member-name">India</span>
                <span class="member-role">Office Operations</span>
            </div>
        </div>

    </div>

</body>
</html>
