<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operations | The Handyman 870</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap" rel="stylesheet">
    <style>
        /* [Insert shared CSS from above for Root and Colors] */
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 80px 20px; }
        .container { max-width: 600px; width: 100%; }
        h1 { font-size: 14px; text-transform: uppercase; letter-spacing: 4px; border-bottom: 2px solid var(--btn-border); padding-bottom: 10px; margin-bottom: 40px; }
        
        .member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--btn-border);
        }
        .name { font-size: 20px; font-weight: 900; text-transform: lowercase; }
        .role { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--sub-text); letter-spacing: 1px; }
        
        .photo-placeholder {
            width: 100px; height: 100px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800; opacity: 0.5;
        }

        .back-btn {
            text-decoration: none; color: var(--text-color); font-size: 12px; font-weight: 800; 
            text-transform: uppercase; border: 2px solid var(--btn-border); padding: 12px 24px;
            margin-top: 50px; display: inline-block; box-shadow: 3px 3px 0 var(--btn-border);
        }
        .back-btn:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Personnel Registry</h1>
        <div class="member-row">
            <div><div class="name">Name</div><div class="role">Lead Operations</div></div>
            <div class="photo-placeholder">IMG_01</div>
        </div>
        <div class="member-row">
            <div><div class="name">Name</div><div class="role">Junior Operations</div></div>
            <div class="photo-placeholder">IMG_02</div>
        </div>
        <div class="member-row">
            <div><div class="name">Name</div><div class="role">Admin Support</div></div>
            <div class="photo-placeholder">IMG_03</div>
        </div>
        <a href="index.html" class="back-btn">Return</a>
    </div>
</body>
</html>
