<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>the handyman 870.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #f0ede4;      
            --text-color: #1a1c1e;    
            --sub-text: #6a727c;
            --btn-bg: #2b59c3;        
            --btn-text: #ffffff;      
            --btn-border: #1a1c1e;    
            --content-bg: #e6e2d6;    
            --accent-glow: #2b59c3;
            --shadow: 6px 6px 0px var(--btn-border);
        }

        [data-theme="dark"] {
            --bg-color: #121416;      
            --text-color: #e3e6e9;
            --sub-text: #9ba3af;
            --btn-bg: #3d71e9;        
            --btn-text: #ffffff;
            --btn-border: #000000;
            --content-bg: #1c1f23;
            --accent-glow: #3d71e9;
            --shadow: 6px 6px 0px #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 24px;
            box-sizing: border-box;
        }

        .nav-item {
            background: transparent;
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 18px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.1s;
        }

        .nav-item:hover {
            background: var(--btn-border);
            color: var(--bg-color);
        }

        .container {
            text-align: center;
            margin-top: 60px;
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: clamp(38px, 9vw, 72px);
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 0;
            text-transform: lowercase; 
        }

        .header-phone {
            font-size: 20px;
            font-weight: 400;
            color: var(--sub-text);
            margin-top: 5px;
            letter-spacing: 3px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 60px 0;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: var(--btn-bg);
            border: 2.5px solid var(--btn-border);
            color: var(--btn-text);
            padding: 22px 40px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.1s;
        }

        .action-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--btn-border);
        }

        .reveal-section {
            display: none;
            background-color: var(--content-bg);
            border: 2.5px solid var(--btn-border);
            padding: 40px;
            margin-bottom: 60px;
            text-align: left;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .section-header::before {
            content: "";
            display: inline-block;
            width: 12px; height: 12px;
            background: var(--accent-glow);
            margin-right: 10px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: 2px solid var(--btn-border);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        #service-map {
            height: 400px;
            width: 100%;
            border: 1.5px solid var(--btn-border);
            filter: grayscale(0.8) contrast(1.1) brightness(0.95); 
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <a href="about.html" class="nav-item">The Team</a>
        <button class="nav-item" onclick="toggleTheme()" id="theme-btn">
            <span id="theme-icon">☀️</span>
        </button>
    </div>

    <div class="container">
        <h1>the handyman 870.</h1>
        <div class="header-phone">(870) ###-####</div>

        <div class="buttons">
            <button class="action-btn" onclick="revealContent('phone-content')">Phone</button>
            <button class="action-btn" onclick="revealContent('message-content')">Inquiry</button>
            <button class="action-btn" onclick="revealContent('service-area')">Service Area</button>
        </div>

        <div id="phone-content" class="reveal-section">
            <div class="section-header">Direct Contact</div>
            <div style="font-size: 36px; font-weight: 900; letter-spacing: 1px;">(870) ###-####</div>
            <p style="color: var(--sub-text); margin-top: 12px;">Calls and project text messages.</p>
        </div>

        <div id="message-content" class="reveal-section">
            <div class="section-header">Project Inquiry</div>
            <form action="https://formspree.io/f/xaqvnvrq" method="POST">
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <input class="form-input" style="flex:1; margin-bottom:0;" name="First_Name" type="text" placeholder="FIRST NAME" required>
                    <input class="form-input" style="flex:1; margin-bottom:0;" name="Last_Name" type="text" placeholder="LAST NAME" required>
                </div>
                <input class="form-input" name="Email" type="email" placeholder="EMAIL" required>
                <input type="text" name="_gotcha" style="display:none">
                <textarea class="form-input" name="Message" rows="5" placeholder="Leave us a few words..."></textarea>
                <button type="submit" class="action-btn" style="width: 100%; box-shadow: none;">Send Request</button>
            </form>
        </div>

        <div id="service-area" class="reveal-section">
            <div class="section-header">Service Area</div>
            <span style="font-style: italic; color: var(--sub-text); display: block; margin-bottom: 20px;">From Little Rock to El Dorado; from Dierks to Pine Bluff</span>
            <div id="service-map"></div>
        </div>

        <div style="height: 100px;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let serviceCircle;

        function initMap() {
            if (!map) {
                map = L.map('service-map', { zoomControl: false }).setView([34.2570, -92.4281], 7);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                updateMapColor();
            }
        }

        function updateMapColor() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const color = (currentTheme === 'dark') ? '#3d71e9' : '#2b59c3';
            if (serviceCircle) {
                serviceCircle.setStyle({color: color, fillColor: color});
            } else {
                serviceCircle = L.circle([34.2570, -92.4281], { 
                    color: color, fillColor: color, fillOpacity: 0.2, radius: 112654 
                }).addTo(map);
            }
        }

        function toggleTheme() {
            const doc = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const isDark = doc.getAttribute('data-theme') === 'dark';
            if (isDark) {
                doc.removeAttribute('data-theme');
                if(icon) icon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                doc.setAttribute('data-theme', 'dark');
                if(icon) icon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
            if (map) updateMapColor();
        }

        function revealContent(id) {
            const ids = ['phone-content', 'message-content', 'service-area'];
            ids.forEach(sectionId => {
                const el = document.getElementById(sectionId);
                if (sectionId === id) {
                    const isVisible = el.style.display === 'block';
                    el.style.display = isVisible ? 'none' : 'block';
                    if (id === 'service-area' && !isVisible) {
                        setTimeout(() => {
                            initMap();
                            map.invalidateSize();
                        }, 100);
                    }
                } else { el.style.display = 'none'; }
            });
        }
    </script>
</body>
</html>
