<!DOCTYPE html>
<html>
<head>
	<title>The Handyman</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="styles.css">
<style>
.container{
	display:grid;
	align-content:center;
}
.container div.contact{
	font-size: 18px
}
</style>
</head>

<body>
<div class="container">
<div class="title">
<!-- Main Content -->
<h1 style="color:white;text-align:center;"> The Handyman </h1>
<h2> From Little Rock to El Dorado; from Dierks to Pine Bluff </h2>
</div>

<div class="map">
<!-- Area of Operation Map -->
<img src="AR-counties-codes-2019_arebUsCourts_dot_gov.jpg" alt="Arkansas Counties">
</div>

<!-- Contact information -->
<script>
function unveilPhone(){
	var elem = document.getElementById("phone");
	if (elem.style.display === "none"){
	elem.style.display = "block";
	} else {
		elem.style.display = "none";
	}
}
function unveilEmail(){
	var elem = document.getElementById("email");
	if (elem.style.display === "none"){
	elem.style.display = "block";
	} else {
		elem.style.display = "none";
	}
}
</script>

<div class="contact">
<button onclick="unveilPhone()">Call or text The Handyman</button>
<div id="phone"> ###-#### </div>
<button onclick="unveilEmail()">Message us</button>
<div id="email"> Email box here - don't forget to leave us your contact information! </div>
</div>
</div>
</body>
</html>
