<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Handyman 870</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #f8f9fa; /* Off-white for a "paper" feel */
            --text-color: #1a202c; /* Deep slate */
            --sub-text: #718096;
            --btn-bg: #e2e8f0;
            --btn-border: #2d3748; /* Darker, more serious borders */
            --accent-blue: #3182ce;
            --content-bg: #ffffff;
            --shadow: 4px 4px 0px var(--btn-border); /* Tactile hard shadow */
        }

        [data-theme="dark"] {
            --bg-color: #121212; /* Deep charcoal, not pure black */
            --text-color: #e2e8f0;
            --sub-text: #a0aec0;
            --btn-bg: #2d3748;
            --btn-border: #4a5568;
            --content-bg: #1a202c;
            --shadow: 4px 4px 0px #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.2s;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Nav Items styled like hardware labels */
        .nav-item {
            background: var(--content-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s;
        }

        .nav-item:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .container {
            text-align: center;
            margin-top: 40px;
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: clamp(34px, 8vw, 64px);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 0;
            text-transform: lowercase; /* Modern, engineered look */
        }

        .header-phone {
            font-size: 24px;
            font-weight: 400;
            color: var(--sub-text);
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Action Buttons with "Press" effect */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 50px 0;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            padding: 20px 40px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.1s;
            text-decoration: none;
        }

        .action-btn:hover {
            background-color: var(--content-bg);
        }

        .action-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* Content Sections */
        .reveal-section {
            display: none;
            background-color: var(--content-bg);
            border: 2px solid var(--btn-border);
            padding: 40px;
            margin-bottom: 60px;
            text-align: left;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Map styling to desaturate background tiles */
        #service-map {
            height: 400px;
            width: 100%;
            border: 1px solid var(--btn-border);
            filter: grayscale(0.5); /* Muted map tiles */
        }

        .form-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid var(--btn-border);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <a href="about.html" class="nav-item">Operations</a>
        <button class="nav-item" onclick="toggleTheme()">Mode</button>
    </div>

    <div class="container">
        <h1>the handyman 870.</h1>
        <div class="header-phone">(870) ###-####</div>

        <div class="buttons">
            <button class="action-btn" onclick="revealContent('phone-content')">Phone</button>
            <button class="action-btn" onclick="revealContent('message-content')">Inquiry</button>
            <button class="action-btn" onclick="revealContent('service-content')">Service</button>
        </div>

        <div id="phone-content" class="reveal-section">
            <div style="font-size: 32px; font-weight: 900; letter-spacing: 1px;">(870) ###-####</div>
            <p style="color: var(--sub-text);">Direct line for calls and SMS messaging.</p>
        </div>

        <div id="message-content" class="reveal-section">
            <form action="https://forms.zohopublic.com/..." method="POST">
                <input class="form-input" type="text" placeholder="FULL NAME" required>
                <input class="form-input" type="email" placeholder="EMAIL ADDRESS" required>
                <textarea class="form-input" rows="5" placeholder="QUESTIONS AND PROJECT DESCRIPTION"></textarea>
                <button type="submit" class="action-btn" style="width: 100%; box-shadow: none;">Submit Dispatch</button>
            </form>
        </div>

        <div id="service-content" class="reveal-section">
            <div style="font-weight: 800; margin-bottom: 20px; text-transform: uppercase;">Active Coverage Area</div>
            <div id="service-map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // LEAFLET LOGIC (Same as before but ready for the theme)
        var map = L.map('service-map').setView([34.2570, -92.4281], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.circle([34.2570, -92.4281], { color: '#3182ce', radius: 112654 }).addTo(map);

        function toggleTheme() {
            const doc = document.documentElement;
            const isDark = doc.getAttribute('data-theme') === 'dark';
            doc.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        function revealContent(id) {
            const ids = ['phone-content', 'message-content', 'service-content'];
            ids.forEach(sectionId => {
                const el = document.getElementById(sectionId);
                el.style.display = (sectionId === id && el.style.display !== 'block') ? 'block' : 'none';
                if (id === 'service-content') setTimeout(() => map.invalidateSize(), 100);
            });
        }
    </script>
</body>
</html>
