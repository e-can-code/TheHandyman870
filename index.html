<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Handyman 870</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        html { scroll-behavior: smooth; }

        /* AUTHORITATIVE Palette */
        :root {
            --bg-color: #ffffff;
            --text-color: #4a86e8;
            --sub-text: #8ab4f8;
            --btn-bg: #cce5ff;
            --btn-border: #4a86e8;
            --content-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #d3d3d3;
            --sub-text: #a9a9a9;
            --btn-bg: #404040;
            --btn-border: #808080;
            --content-bg: #222222;
        }

        /* Global Styles */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Navigation Bar - Balanced Harmony */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 20px;
            box-sizing: border-box;
        }

        .nav-item {
            background: transparent;
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            font-size: 14px;
            font-weight: bold;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            height: 38px;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background-color: var(--btn-bg);
        }

        /* Main Content Container */
        .container {
            text-align: center;
            margin-top: 20px;
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: clamp(32px, 8vw, 52px); /* Scales for mobile */
            margin-bottom: 0;
            letter-spacing: -1px;
        }

        .header-phone {
            font-size: 24px;
            color: var(--sub-text);
            margin: 5px 0 0 0;
            font-weight: normal;
            letter-spacing: 1px;
        }

        h3 {
            font-size: 18px;
            color: var(--sub-text);
            font-weight: normal;
            margin-top: 5px;
            margin-bottom: 40px;
            font-style: italic;
        }

        /* Main 3 Action Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .action-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            padding: 18px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        /* Reveal Sections */
        .reveal-section {
            display: none;
            background-color: var(--content-bg);
            border: 1px solid var(--btn-border);
            padding: 30px;
            border-radius: 4px;
            margin-bottom: 60px;
            animation: fadeIn 0.3s;
            width: 100%;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .phone-display {
            font-size: clamp(28px, 6vw, 36px);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }

        .contact-form input, .contact-form textarea {
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
        }

        #service-map {
            height: 400px; 
            width: 100%; 
            border: 1px solid var(--btn-border);
            z-index: 1;
            margin-top: 15px;
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <a href="about.html" class="nav-item">About Us</a>
        <button class="nav-item" onclick="toggleTheme()" aria-label="Toggle Light/Dark Mode">
            ☀️/🌙
        </button>
    </div>

    <div class="container">
        <h1>The Handyman 870</h1>
        <h2 class="header-phone">(870) ###-####</h2>
        <h3>From place to place, place to place</h3>

        <div class="buttons">
            <button class="action-btn" onclick="revealContent('phone-content')">Phone</button>
            <button class="action-btn" onclick="revealContent('message-content')">Message Us</button>
            <button class="action-btn" onclick="revealContent('service-content')">Service Area</button>
        </div>

        <div id="phone-content" class="reveal-section">
            <div class="phone-display">(870) ###-####</div>
            <p style="margin:0;">Available for calls or texts.</p>
            <a href="tel:870#######" style="display:inline-block; margin-top:15px; color:var(--text-color); font-weight:bold;">Click to Call Now</a>
        </div>

        <div id="message-content" class="reveal-section">
            <h3 style="color:var(--text-color); font-style:normal; font-weight:bold; margin-bottom:20px;">Project Inquiry</h3>
            <form class="contact-form" action="https://forms.zohopublic.com/canadayechogm1/form/ContactUs/formperma/-q2roauxH3djGCkn4e2R9S6D01q8QhJzNczH5xCFTzQ/htmlRecords/submit" name="form" id="form" method="POST" accept-charset="UTF-8" enctype="multipart/form-data">
                <input type="hidden" name="zf_referrer_name" value="">
                <input type="hidden" name="zf_redirect_url" value="">
                <input type="hidden" name="zc_gad" value="">

                <input type="text" name="Name_First" placeholder="First Name" required>
                <input type="text" name="Name_Last" placeholder="Last Name" required>
                <input type="text" name="Email" placeholder="Email Address" required>
                <textarea name="MultiLine" rows="5" placeholder="Tell us what you need fixed..." required></textarea>
                
                <button type="submit" class="action-btn" style="padding: 10px; width: 100%;">Send Request</button>
            </form>
        </div>

        <div id="service-content" class="reveal-section">
            <h3 style="color:var(--text-color); font-style:normal; font-weight:bold; margin-bottom:10px;">Service Radius</h3>
            <p>From Little Rock to El Dorado; from Dierks to Pine Bluff</p>
            <div id="service-map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        var lat = 34.2570; 
        var lng = -92.4281;
        var radiusInMiles = 70; 

        var map = L.map('service-map').setView([lat, lng], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var radiusInMeters = radiusInMiles * 1609.34;
        var serviceCircle = L.circle([lat, lng], {
            color: '#4a86e8',       
            fillColor: '#8ab4f8',   
            fillOpacity: 0.3,       
            radius: radiusInMeters
        }).addTo(map);

        function toggleTheme() {
            const body = document.documentElement;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function revealContent(sectionId) {
            const sections = ['phone-content', 'message-content', 'service-content'];
            sections.forEach(id => {
                const element = document.getElementById(id);
                if (id === sectionId) {
                    if (element.style.display === 'block') {
                        element.style.display = 'none';
                    } else {
                        element.style.display = 'block';
                        if (id === 'service-content') {
                            setTimeout(() => { map.invalidateSize(); }, 100);
                        }
                    }
                } else {
                    element.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
