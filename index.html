<!DOCTYPE html>
<html>
<head>
	<title>The Handyman</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="styles.css">
<style>
.container{
	display:grid;
	align-content:center;
}
.container div.contact{
	display:flex;
	font-size: 18px
}
.button {
  background-color: DarkGray;
  border: gray 1px solid;
  border-radius: 4px;
  color: black;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">
<div class="title">
<!-- Main Content -->
<h1 style="color:white;text-align:center;"> The Handyman </h1>
<h2 style="text-align:center;"> From Little Rock to El Dorado; from Dierks to Pine Bluff </h2>
</div>

<div class="map">
<!-- Area of Operation Map -->
<img src="AR-counties-codes-2019_arebUsCourts_dot_gov.jpg" alt="Arkansas Counties">
</div>

<!-- Contact information -->
<script>
function unveilPhone(){
	var elem = document.getElementById("phone");
	if (elem.style.display === "none"){
	elem.style.display = "block";
	} else {
		elem.style.display = "none";
	}
}
function unveilEmail(){
	var elem = document.getElementById("email");
	if (elem.style.display === "none"){
	elem.style.display = "block";
	} else {
		elem.style.display = "none";
	}
}
</script>

<div class="contact">
<button onclick="unveilPhone()">Call or text The Handyman</button>
<button onclick="unveilEmail()">Message us</button>
<div id="phone"> ###-#### </div>
<div id="email"> Email box here - don't forget to leave us your contact information! </div>
</div>
</div>
</body>
</html>
