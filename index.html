<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Handyman</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }

        /* Modern, High-Trust Color Variables */
        :root {
            --bg-color: #f4f6f8;       /* Soft off-white background */
            --content-bg: #ffffff;     /* Pure white for cards/sections */
            --text-color: #334155;     /* Dark slate for high readability */
            --sub-text: #64748b;       /* Lighter slate for secondary text */
            --primary-blue: #2563eb;   /* Deep, trustworthy professional blue */
            --primary-hover: #1d4ed8;  /* Slightly darker blue for hovering */
            --btn-text: #ffffff;       /* White text for buttons */
            --border-color: #e2e8f0;   /* Very faint gray for subtle dividing lines */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;       /* Deep slate instead of harsh pure black */
            --content-bg: #1e293b;     /* Slightly lighter slate for cards */
            --text-color: #f8fafc;     /* Off-white text to prevent eye strain */
            --sub-text: #94a3b8;       
            --primary-blue: #3b82f6;   /* Brighter blue to pop against dark mode */
            --primary-hover: #60a5fa;  
            --btn-text: #ffffff;       
            --border-color: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* Global Styles with System Fonts */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end; /* Change to space-between for about.html */
            padding: 20px;
            box-sizing: border-box;
        }

        .theme-toggle, .back-btn {
            background: var(--content-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 20px;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 50px; /* Pill shape */
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .theme-toggle:hover, .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.15);
        }

        /* Main Content Container */
        .container {
            text-align: center;
            margin-top: 30px;
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px; /* Tighter letter spacing looks more modern */
        }

        h2 {
            font-size: 24px;
            color: var(--primary-blue); /* Highlighting the phone number */
            margin-top: 0;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 20px;
            color: var(--sub-text);
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* Buttons Container */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        /* Modernized Buttons */
        .action-btn {
            background-color: var(--primary-blue);
            border: none;
            color: var(--btn-text);
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px; /* Softer corners */
            box-shadow: var(--shadow);
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px); /* Slight "lift" effect */
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); /* Blue tinted shadow */
        }

        /* Reveal & Permanent Sections (Card Styling) */
        .reveal-section, .permanent-section, .team-card {
            background-color: var(--content-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 16px; /* Smooth, modern corners */
            margin-bottom: 40px;
            box-shadow: var(--shadow); /* App-like depth */
        }

        .reveal-section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .permanent-section {
            margin-top: 20px;
            margin-bottom: 60px;
            width: 100%;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Specific Content Styles */
        .phone-display {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: 1px;
        }

        /* Modern Form Inputs */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .contact-form input, .contact-form textarea {
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.2s, outline 0.2s;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); /* Focus ring */
        }

        .map-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* About Page Extras */
        .about-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 50px;
            color: var(--text-color);
        }

        .team-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .image-placeholder {
            width: 150px;
            height: 150px;
            background-color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--sub-text);
            font-weight: 600;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            border: 2px dashed var(--border-color);
        }

        .team-card h4 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: var(--text-color);
        }

        .team-card p {
            margin: 0;
            color: var(--sub-text);
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Light/Dark Mode">
            ☀️ / 🌙
        </button>
    </div>

    <div class="container">
        <h1>The Handyman 870</h1>
        <h2>(###) ###-####</h2>
        <h3>From place to place, place to place</h3>

        <div class="buttons">
            <button class="action-btn" onclick="revealContent('phone-content')">Phone</button>
            <button class="action-btn" onclick="revealContent('message-content')">Message Us</button>
            <a href="about.html" class="action-btn">About Us</a>
        </div>

        <div id="phone-content" class="reveal-section">
            <div class="phone-display">(###) ###-####</div>
            <p>Call or text us anytime!</p>
        </div>

        <div id="message-content" class="reveal-section">
            <form class="contact-form" action="https://forms.zohopublic.com/canadayechogm1/form/ContactUs/formperma/-q2roauxH3djGCkn4e2R9S6D01q8QhJzNczH5xCFTzQ/htmlRecords/submit" name="form" id="form" method="POST" accept-charset="UTF-8" enctype="multipart/form-data">
                <input type="hidden" name="zf_referrer_name" value="">
                <input type="hidden" name="zf_redirect_url" value="">
                <input type="hidden" name="zc_gad" value="">

                <input type="text" name="Name_First" fieldType="7" maxlength="255" placeholder="First Name" required>
                <input type="text" name="Name_Last" fieldType="7" maxlength="255" placeholder="Last Name" required>
                
                <input type="text" name="Email" checktype="c5" fieldType="9" maxlength="255" placeholder="Email" required>
                <textarea name="MultiLine" checktype="c1" maxlength="65535" rows="5" placeholder="Leave us a few words" required></textarea>
                
                <button type="submit" class="action-btn" style="padding: 10px;">Send Message</button>
            </form>
        </div>

        <div id="service-content" class="permanent-section">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-weight: bold; color: var(--text-color);">Our Service Area</h3>
            <p style="margin-bottom: 20px;">From Little Rock to El Dorado; from Dierks to Pine Bluff</p>
            <img class="map-img" src="AR-counties-codes-2019_arebUsCourts_dot_gov.jpg" alt="Map of Arkansas Counties">
        </div>

    </div>

    <script>
        // Updated Toggle: Now saves the preference to localStorage
        function toggleTheme() {
            const body = document.documentElement;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function revealContent(sectionId) {
            const sections = ['phone-content', 'message-content'];
            sections.forEach(id => {
                const element = document.getElementById(id);
                if (id === sectionId) {
                    if (element.style.display === 'block') {
                        element.style.display = 'none';
                    } else {
                        element.style.display = 'block';
                    }
                } else {
                    element.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
